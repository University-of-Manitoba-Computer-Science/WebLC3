services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    profiles:
      - dev

  production:
    build:
      context: .
      target: production
    ports:
      - "8080:80"
    profiles:
      - production
